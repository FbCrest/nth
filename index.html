<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nghịch Thuỷ Hàn Mobile</title>
    <!-- Preload fonts để tránh FOUT -->
    <link rel="preload" href="/fonts/Fz GameBr.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/fzssksj_z.woff" as="font" type="font/woff" crossorigin="anonymous" />
    <!-- Google Fonts qua link thay vì @import để load sớm hơn -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      (function () {
        const name = 'Nghịch Thuỷ Hàn Mobile';
        // 2 icon luôn có mặt 2 bên, chỉ đổi qua lại giữa ✦ và ✧
        const frames = [
          '✦ ' + name + ' ✦',
          '✦ ' + name + ' ✧',
          '✧ ' + name + ' ✧',
          '✧ ' + name + ' ✦',
        ];
        let i = 0;
        function tick() {
          document.title = frames[i % frames.length];
          i++;
          setTimeout(tick, 700);
        }
        window.addEventListener('DOMContentLoaded', tick);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
